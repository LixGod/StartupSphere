version: '3.8'

services:
  trendlyzer-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: trendlyzer-app-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - GROQ_API_KEY=${GROQ_API_KEY}
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    stdin_open: true
    tty: true
